<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>الفجر القرمزي</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #f5f5f5;
      --black: #0a0a0a;
      --gray: #1a1a1a;
      --light-gray: #2a2a2a;
      --accent: #ffffff;
      --border: rgba(255,255,255,0.12);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ---- BACKGROUND TEXTURE ---- */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,255,255,0.04) 0%, transparent 70%),
        repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(255,255,255,0.015) 60px, rgba(255,255,255,0.015) 61px),
        repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(255,255,255,0.015) 60px, rgba(255,255,255,0.015) 61px);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 20px 60px;
      position: relative;
      z-index: 1;
    }

    /* ---- HEADER ---- */
    .header {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeDown 0.8s ease both;
    }

    /* ---- TEAM IMAGE CIRCLE ---- */
    .team-image-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }

    .team-image-circle {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25);
      overflow: hidden;
      position: relative;
      box-shadow:
        0 0 0 6px rgba(255,255,255,0.05),
        0 0 40px rgba(255,255,255,0.08),
        0 8px 32px rgba(0,0,0,0.8);
      animation: pulseRing 3s ease-in-out infinite;
    }

    .team-image-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      filter: grayscale(30%) contrast(1.1);
      transition: transform 0.4s ease;
    }

    .team-image-circle:hover img {
      transform: scale(1.06);
    }

    @keyframes pulseRing {
      0%, 100% { box-shadow: 0 0 0 6px rgba(255,255,255,0.05), 0 0 40px rgba(255,255,255,0.08), 0 8px 32px rgba(0,0,0,0.8); }
      50% { box-shadow: 0 0 0 10px rgba(255,255,255,0.1), 0 0 60px rgba(255,255,255,0.15), 0 8px 32px rgba(0,0,0,0.8); }
    }

    /* ---- TITLE ---- */
    .title {
      font-size: clamp(2.4rem, 8vw, 3.8rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #fff;
      text-shadow: 0 0 30px rgba(255,255,255,0.2), 0 2px 8px rgba(0,0,0,0.8);
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 400;
    }

    /* ---- DIVIDER ---- */
    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
      margin: 20px auto;
    }

    /* ---- LINKS SECTION ---- */
    .links-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 40px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 24px;
      background: var(--gray);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--white);
      text-decoration: none;
      font-family: 'Tajawal', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.6s ease both;
    }

    .link-btn:nth-child(1) { animation-delay: 0.15s; }
    .link-btn:nth-child(2) { animation-delay: 0.28s; }

    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .link-btn:hover {
      border-color: rgba(255,255,255,0.35);
      background: var(--light-gray);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
    }

    .link-btn:hover::before { opacity: 1; }
    .link-btn:active { transform: translateY(0); }

    .btn-label {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
      transition: background 0.25s;
    }

    .link-btn:hover .btn-icon {
      background: rgba(255,255,255,0.14);
    }

    .btn-text { font-size: 1rem; font-weight: 700; }
    .btn-sub  { font-size: 0.78rem; color: rgba(255,255,255,0.45); font-weight: 400; margin-top: 2px; }

    .btn-arrow {
      color: rgba(255,255,255,0.3);
      font-size: 1.1rem;
      transition: color 0.25s, transform 0.25s;
    }

    .link-btn:hover .btn-arrow {
      color: rgba(255,255,255,0.7);
      transform: translateX(-4px);
    }

    /* ---- CONTACT SECTION ---- */
    .contact-section {
      text-align: center;
      padding: 28px 24px;
      background: var(--gray);
      border: 1px solid var(--border);
      border-radius: 16px;
      animation: fadeUp 0.6s 0.4s ease both;
    }

    .contact-label {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.1em;
      margin-bottom: 12px;
      font-weight: 400;
    }

    .contact-text {
      font-size: 1rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .contact-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 28px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      color: var(--white);
      text-decoration: none;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      transition: all 0.25s ease;
    }

    .contact-btn:hover {
      background: rgba(255,255,255,0.13);
      border-color: rgba(255,255,255,0.4);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    /* ---- FOOTER ---- */
    .footer {
      text-align: center;
      margin-top: 44px;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.1em;
      animation: fadeUp 0.6s 0.55s ease both;
    }

    /* ---- ANIMATIONS ---- */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---- MODAL OVERLAY ---- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }

    .modal-box {
      background: #111;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 32px 28px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      animation: fadeUp 0.35s ease both;
      position: relative;
    }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 900;
      text-align: center;
      margin-bottom: 8px;
      color: #fff;
    }

    .modal-subtitle {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
      text-align: center;
      letter-spacing: 0.1em;
      margin-bottom: 24px;
    }

    .field-group {
      margin-bottom: 18px;
    }

    .field-label {
      display: block;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.6);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .field-input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    .field-input:focus {
      border-color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.09);
    }

    .field-input::placeholder { color: rgba(255,255,255,0.25); }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px;
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: not-allowed;
      margin-top: 8px;
      transition: all 0.25s ease;
      opacity: 0.35;
    }

    .submit-btn:not(:disabled):hover {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.5);
      transform: translateY(-2px);
    }

    .close-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.4);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
      transition: color 0.2s;
    }

    .close-btn:hover { color: rgba(255,255,255,0.8); }
  </style>
</head>

  <script>
    function openForm() {
      document.getElementById('joinModal').classList.add('active');
      document.body.style.overflow = 'hidden';
      checkFields();
    }
    function closeForm() {
      document.getElementById('joinModal').classList.remove('active');
      document.body.style.overflow = '';
    }
    function handleOverlayClick(e) {
      if (e.target === document.getElementById('joinModal')) closeForm();
    }
    function checkFields() {
      var name     = document.getElementById('f_name').value.trim();
      var level    = document.getElementById('f_level').value.trim();
      var interact = document.getElementById('f_interact').value.trim();
      var teams    = document.getElementById('f_teams').value.trim();
      var games    = document.getElementById('f_games').value.trim();
      var age      = document.getElementById('f_age').value.trim();
      var btn = document.getElementById('submitBtn');
      var allFilled = name && level && interact && teams && games && age;
      btn.disabled = !allFilled;
      btn.style.opacity = allFilled ? '1' : '0.35';
      btn.style.cursor = allFilled ? 'pointer' : 'not-allowed';
    }
    document.addEventListener('DOMContentLoaded', function() {
      ['f_name','f_level','f_interact','f_teams','f_games','f_age'].forEach(function(id) {
        document.getElementById(id).addEventListener('input', checkFields);
      });
    });
    function submitForm() {
      var name     = document.getElementById('f_name').value.trim();
      var level    = document.getElementById('f_level').value.trim();
      var interact = document.getElementById('f_interact').value.trim();
      var teams    = document.getElementById('f_teams').value.trim();
      var games    = document.getElementById('f_games').value.trim();
      var age      = document.getElementById('f_age').value.trim();
      if (!name || !level || !interact || !teams || !games || !age) return;
      closeForm();
      var msg = '📋 معلومات الانضمام للطاقم\n\n'
        + '○ الاسم الكريم: ' + name + '\n'
        + '○ العمر: ' + age + '\n'
        + '○ مستوى اللعب: ' + level + '\n'
        + '○ التفاعل بالطاقم: ' + interact + '\n'
        + '○ الطواقم السابقة: ' + teams + '\n'
        + '○ الألعاب: ' + games;
      var encoded = encodeURIComponent(msg);
      window.open('https://t.me/ha_s_hira?text=' + encoded, '_blank');
      // Show join group button
      document.getElementById('joinGroupBtn').style.display = 'block';
    }
  </script>
